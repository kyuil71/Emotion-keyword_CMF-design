<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#F6F2EF">
<title>CMF 디자인 방법론 · 감성에서 샘플까지</title>
<style>
  :root{
    --paper:#F6F2EF;
    --card:#FFFFFF;
    --ink:#2B2522;
    --ink2:#6E625C;
    --ink3:#9C8F88;
    --line:#E4DBD5;
    --line2:#F0E9E4;
    --accent:#A9857E;
    --accent-deep:#8A6660;
    --blush:#F1E3DE;
    --sel:#FBF4F1;
    --serif:"Apple SD Gothic Neo","AppleMyungjo","Nanum Myeongjo","Noto Serif KR",Batang,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif;
    --tap:44px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--sans);font-size:14px;line-height:1.6;
    overscroll-behavior-y:none;
  }
  h1,h2,h3,.serif{font-family:var(--serif);font-weight:400}

  /* ---------- shell ---------- */
  #app{display:flex;flex-direction:column;height:100dvh;max-width:520px;margin:0 auto;
       background:var(--paper);position:relative;overflow:hidden;
       box-shadow:0 0 0 1px var(--line2)}

  header#top{padding:calc(env(safe-area-inset-top) + 12px) 18px 10px;background:var(--paper);
             border-bottom:1px solid var(--line);flex:0 0 auto;z-index:5}
  .brandrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .brand{font-family:var(--serif);font-size:15px;letter-spacing:.02em}
  .brand small{font-family:var(--sans);font-size:9px;letter-spacing:.18em;color:var(--ink3);
               text-transform:uppercase;display:block;margin-top:2px}
  .stepno{font-size:10px;letter-spacing:.16em;color:var(--accent);white-space:nowrap}

  .rail{display:flex;gap:4px;margin-top:11px}
  .rail i{flex:1;height:2px;background:var(--line);border-radius:2px;transition:background .35s}
  .rail i.on{background:var(--accent)}
  .rail i.done{background:var(--blush)}

  main#stage{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
             padding:20px 18px 24px}
  .screen{animation:slide .38s cubic-bezier(.22,.68,.35,1) both}
  @keyframes slide{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.screen{animation:none}}

  footer#cta{flex:0 0 auto;padding:10px 18px calc(env(safe-area-inset-bottom) + 12px);
             background:linear-gradient(to top,var(--paper) 72%,rgba(246,242,239,0));
             border-top:1px solid var(--line);display:flex;gap:9px;align-items:center}
  .count{font-size:11px;color:var(--ink3);letter-spacing:.02em;flex:1 1 auto;min-width:0}
  .count b{color:var(--accent-deep);font-weight:600}
  button{font-family:var(--sans);font-size:13px;border-radius:2px;cursor:pointer;border:1px solid transparent}
  .btn{min-height:var(--tap);padding:0 20px;background:var(--ink);color:#fff;letter-spacing:.06em;
       transition:opacity .2s,background .2s}
  .btn:disabled{background:var(--line);color:var(--ink3);cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--ink2);border-color:var(--line);padding:0 14px}
  .btn:active:not(:disabled){opacity:.78}

  /* ---------- step heading ---------- */
  .eyebrow{font-size:9px;letter-spacing:.26em;color:var(--accent);text-transform:uppercase;margin-bottom:7px}
  .title{font-family:var(--serif);font-size:23px;line-height:1.32;letter-spacing:-.01em;margin:0 0 8px}
  .lede{font-size:12.5px;color:var(--ink2);margin:0 0 18px;line-height:1.72}
  .rule{height:1px;background:var(--line);margin:18px 0}

  /* ---------- step 1 ---------- */
  .field{position:relative;margin-bottom:16px}
  textarea#kw{width:100%;min-height:96px;resize:none;padding:15px 14px;background:var(--card);
    border:1px solid var(--line);border-radius:2px;font-family:var(--serif);font-size:18px;line-height:1.55;
    color:var(--ink);outline:none;transition:border-color .2s}
  textarea#kw:focus{border-color:var(--accent)}
  textarea#kw::placeholder{color:#C9BEB8}
  .caplbl{font-size:9px;letter-spacing:.2em;color:var(--ink3);margin:20px 0 9px;text-transform:uppercase}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:999px;
        font-size:12px;color:var(--ink2);line-height:1.3}
  .chip:active{background:var(--sel);border-color:var(--accent);color:var(--accent-deep)}

  /* ---------- generated image ---------- */
  .plate{background:var(--card);border:1px solid var(--line);padding:9px;margin-bottom:6px}
  .plate svg{display:block;width:100%;height:auto}
  .platecap{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.14em;
            color:var(--ink3);text-transform:uppercase;margin:0 2px 20px}

  /* ---------- option cards ---------- */
  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{background:var(--card);border:1px solid var(--line);padding:14px 14px 14px 42px;position:relative;
       border-radius:2px;transition:border-color .18s,background .18s}
  .opt .mark{position:absolute;left:14px;top:15px;width:16px;height:16px;border:1px solid var(--line);
             border-radius:50%;display:flex;align-items:center;justify-content:center;
             font-size:8px;color:transparent;transition:all .18s}
  .opt.on{border-color:var(--accent);background:var(--sel)}
  .opt.on .mark{background:var(--accent);border-color:var(--accent);color:#fff}
  .opt h4{margin:0 0 5px;font-family:var(--serif);font-size:15.5px;font-weight:400;line-height:1.4}
  .opt .en{font-size:9.5px;letter-spacing:.16em;color:var(--ink3);text-transform:uppercase;margin-bottom:6px}
  .opt p{margin:0;font-size:12px;color:var(--ink2);line-height:1.68}
  .opt .num{position:absolute;right:12px;top:12px;font-size:9px;letter-spacing:.12em;color:#CFC4BE}

  .opt.sentence{padding:18px 16px 18px 42px}
  .opt.sentence p{font-family:var(--serif);font-size:14.5px;line-height:1.85;color:var(--accent-deep);text-align:center}

  /* ---------- property sliders ---------- */
  .props{display:flex;flex-direction:column;gap:2px}
  .prop{background:var(--card);border:1px solid var(--line);padding:12px 14px 14px 40px;position:relative;
        border-radius:2px;transition:border-color .18s,background .18s}
  .prop+.prop{margin-top:7px}
  .prop .mark{position:absolute;left:13px;top:14px;width:16px;height:16px;border:1px solid var(--line);
              border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;color:transparent}
  .prop.on{border-color:var(--accent);background:var(--sel)}
  .prop.on .mark{background:var(--accent);border-color:var(--accent);color:#fff}
  .prop .hd{display:flex;align-items:baseline;gap:7px;margin-bottom:9px}
  .prop .kr{font-size:13.5px}
  .prop .en{font-size:9px;letter-spacing:.14em;color:var(--ink3);text-transform:uppercase}
  .prop .val{margin-left:auto;font-size:10px;color:var(--accent);letter-spacing:.06em}
  .track{display:flex;align-items:center;gap:8px}
  .track span{font-size:8px;letter-spacing:.12em;color:var(--ink3);width:34px;flex:0 0 auto}
  .track span:last-child{text-align:right}
  .bar{flex:1;height:1px;background:var(--line);position:relative}
  .bar i{position:absolute;top:50%;width:9px;height:9px;border-radius:50%;background:var(--accent);
         transform:translate(-50%,-50%);transition:left .5s cubic-bezier(.3,.8,.3,1)}
  .prop .note{font-size:11px;color:var(--ink3);margin:9px 0 0;line-height:1.6}

  /* ---------- material cards ---------- */
  .mat{display:flex;gap:0;background:var(--card);border:1px solid var(--line);border-radius:2px;
       overflow:hidden;position:relative;transition:border-color .18s}
  .mat+.mat{margin-top:8px}
  .mat.on{border-color:var(--accent)}
  .mat .sw{flex:0 0 78px;align-self:stretch}
  .mat .sw svg{display:block;width:100%;height:100%}
  .mat .bd{padding:13px 13px 13px 34px;position:relative;flex:1;min-width:0}
  .mat .mark{position:absolute;left:10px;top:14px;width:16px;height:16px;border:1px solid var(--line);
             border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;color:transparent}
  .mat.on .mark{background:var(--accent);border-color:var(--accent);color:#fff}
  .mat h4{margin:0 0 2px;font-size:14px;font-weight:600;letter-spacing:.02em}
  .mat .krn{font-size:10px;color:var(--ink3);margin-bottom:7px}
  .mat ul{margin:0;padding:0;list-style:none}
  .mat li{font-size:11.5px;color:var(--ink2);line-height:1.62;padding-left:11px;position:relative}
  .mat li:before{content:"→";position:absolute;left:0;color:var(--accent);font-size:9px}
  .mat .eff{font-size:11px;color:var(--ink3);margin:7px 0 0;line-height:1.6}

  /* ---------- sample list ---------- */
  .smp{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .smp .cell{background:var(--card);border:1px solid var(--line);padding:9px;border-radius:2px}
  .smp .cell .no{font-size:8.5px;letter-spacing:.14em;color:var(--accent);margin-bottom:4px}
  .smp .cell h5{margin:0 0 1px;font-size:12px;font-weight:600;line-height:1.35}
  .smp .cell .en{font-size:9px;color:var(--ink3);letter-spacing:.06em;margin-bottom:7px}
  .smp .cell svg{display:block;width:100%;height:auto}
  .smp .cell .spec{font-size:9.5px;color:var(--ink3);margin-top:7px;line-height:1.5}

  /* ---------- board ---------- */
  #boardWrap{border:1px solid var(--line);background:var(--card);overflow:auto;
             -webkit-overflow-scrolling:touch;margin-bottom:12px}
  #boardWrap svg{display:block}
  #boardWrap.fit svg{width:100%;height:auto}
  #boardWrap.zoom svg{width:1536px;height:auto;max-width:none}
  .boardbar{display:flex;gap:7px;margin-bottom:18px}
  .boardbar button{flex:1;min-height:40px;background:var(--card);border:1px solid var(--line);color:var(--ink2);font-size:12px}
  .boardbar button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* ---------- summary ---------- */
  .sum{background:var(--card);border:1px solid var(--line);padding:15px;margin-bottom:9px}
  .sum h6{margin:0 0 6px;font-size:9px;letter-spacing:.2em;color:var(--accent);text-transform:uppercase;font-weight:500}
  .sum p{margin:0;font-size:12px;color:var(--ink2);line-height:1.7}
  .tagrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
  .tag{font-size:10.5px;padding:4px 9px;background:var(--paper);border:1px solid var(--line2);color:var(--ink2);border-radius:999px}

  /* ---------- loading / notice ---------- */
  .load{padding:46px 0;text-align:center}
  .load .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);display:inline-block;margin:0 3px;
             animation:pl 1.1s infinite ease-in-out}
  .load .dot:nth-child(2){animation-delay:.15s}.load .dot:nth-child(3){animation-delay:.3s}
  @keyframes pl{0%,80%,100%{opacity:.22;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
  .load p{font-size:11.5px;color:var(--ink3);letter-spacing:.08em;margin-top:16px}
  .notice{font-size:11px;color:var(--ink3);background:var(--card);border:1px solid var(--line);
          padding:11px 12px;margin-bottom:14px;line-height:1.6}
  .notice a{color:var(--accent-deep)}
  .keyrow{display:flex;gap:6px;margin-top:9px}
  .keyrow input{flex:1;min-width:0;padding:9px 10px;border:1px solid var(--line);background:var(--paper);
                font-size:11px;font-family:var(--sans);outline:none;border-radius:2px}
  .keyrow button{padding:0 13px;min-height:36px;background:var(--ink);color:#fff;font-size:11px}
  .err{border-color:#C8A49E;color:var(--accent-deep)}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brandrow">
      <div class="brand">CMF 디자인 방법론<small>Emotion → Sample</small></div>
      <div class="stepno" id="stepno">01 / 08</div>
    </div>
    <div class="rail" id="rail"></div>
  </header>
  <main id="stage"></main>
  <footer id="cta">
    <button class="btn ghost" id="back">이전</button>
    <div class="count" id="count"></div>
    <button class="btn" id="next">다음 단계</button>
  </footer>
</div>

<script>
"use strict";
/* ==========================================================================
   0. 유틸
   ========================================================================== */
const $ = s => document.querySelector(s);
const stage = $("#stage");
let UID = 0;
const uid = () => "u" + (++UID);

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

function hx(h){h=String(h||"#CCC").replace("#","");if(h.length===3)h=h.split("").map(c=>c+c).join("");
  const n=parseInt(h,16);return {r:(n>>16)&255,g:(n>>8)&255,b:n&255};}
function rgb2hex(r,g,b){return "#"+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,"0")).join("");}
function lighten(h,t){const c=hx(h);return rgb2hex(c.r+(255-c.r)*t,c.g+(255-c.g)*t,c.b+(255-c.b)*t);}
function darken(h,t){const c=hx(h);return rgb2hex(c.r*(1-t),c.g*(1-t),c.b*(1-t));}
function withA(h,a){const c=hx(h);return `rgba(${c.r},${c.g},${c.b},${a})`;}
function toHsl(hex){const c=hx(hex),r=c.r/255,g=c.g/255,b=c.b/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0;const l=(mx+mn)/2;
  if(mx!==mn){const dd=mx-mn;s=l>.5?dd/(2-mx-mn):dd/(mx+mn);
    h=mx===r?((g-b)/dd+(g<b?6:0)):mx===g?((b-r)/dd+2):((r-g)/dd+4);h/=6;}
  return {h:h*360,s:s*100,l:l*100};}
function fromHsl(h,s,l){h=((h%360)+360)%360/360;s=clamp(s,0,100)/100;l=clamp(l,0,100)/100;
  const q=l<.5?l*(1+s):l+s-l*s,p2=2*l-q;
  const f=t=>{t=(t+1)%1;if(t<1/6)return p2+(q-p2)*6*t;if(t<.5)return q;if(t<2/3)return p2+(q-p2)*(2/3-t)*6;return p2;};
  return rgb2hex(f(h+1/3)*255,f(h)*255,f(h-1/3)*255);}
function shift(hex,dh,ds,dl){const c=toHsl(hex);return fromHsl(c.h+(dh||0),c.s+(ds||0),c.l+(dl||0));}
function mixHex(a,b,t){const x=hx(a),y=hx(b);return rgb2hex(x.r+(y.r-x.r)*t,x.g+(y.g-x.g)*t,x.b+(y.b-x.b)*t);}
function tint(pal,tone,amt){return pal.map((c,i)=>mixHex(c,tone[i%tone.length],amt));}
function variant(pal,i){
  if(i===1) return pal.map(c=>shift(c,-6,-6,+5));
  if(i===2) return pal.map(c=>shift(c,+8,+4,-7));
  return pal.slice();}

/* 한글/영문 혼합 텍스트 폭 추정 후 줄바꿈 */
function chW(ch,fs){
  if(/[\u1100-\u11FF\u3130-\u318F\uAC00-\uD7AF\u4E00-\u9FFF\u3000-\u303F]/.test(ch)) return fs*1.0;
  if(/[ ]/.test(ch)) return fs*0.28;
  if(/[.,'’\-:;!|()]/.test(ch)) return fs*0.32;
  if(/[iltjfrI]/.test(ch)) return fs*0.32;
  if(/[A-Z0-9]/.test(ch)) return fs*0.62;
  return fs*0.53;
}
function wrap(text,maxW,fs,maxLines){
  const s=String(text||"").trim(); const lines=[]; let cur="",w=0;
  for(let i=0;i<s.length;i++){
    const ch=s[i];
    if(ch==="\n"){lines.push(cur);cur="";w=0;continue;}
    const cw=chW(ch,fs);
    if(w+cw>maxW && cur.length){
      const sp=cur.lastIndexOf(" ");
      if(sp>cur.length-8 && sp>2){lines.push(cur.slice(0,sp));cur=cur.slice(sp+1)+ch;}
      else{lines.push(cur);cur=ch;}
      w=0;for(const c of cur)w+=chW(c,fs);
    } else {cur+=ch;w+=cw;}
    if(maxLines&&lines.length>=maxLines)break;
  }
  if(cur&&(!maxLines||lines.length<maxLines))lines.push(cur);
  if(maxLines&&lines.length>=maxLines&&cur){/* trimmed */}
  return lines;
}
function svgText(x,y,lines,o){
  o=o||{};
  const fam=o.serif?"AppleMyungjo, 'Nanum Myeongjo', 'Noto Serif KR', Batang, serif"
                   :"'Apple SD Gothic Neo','Pretendard','Malgun Gothic','Noto Sans KR',sans-serif";
  const lh=o.lh||(o.fs*1.62);
  return `<text x="${x}" y="${y}" font-family="${fam}" font-size="${o.fs}" fill="${o.fill}"`+
    (o.weight?` font-weight="${o.weight}"`:``)+(o.ls?` letter-spacing="${o.ls}"`:``)+
    (o.anchor?` text-anchor="${o.anchor}"`:``)+`>`+
    lines.map((l,i)=>`<tspan x="${x}" dy="${i===0?0:lh}">${esc(l)}</tspan>`).join("")+`</text>`;
}

/* ==========================================================================
   1. 절차적 머티리얼 렌더러 (SVG)
   ========================================================================== */
const ARCH = ["silk","petal","metal","glass","stone","pearl","liquid","fabric"];

function normP(p){
  p=p||{};
  let pal=Array.isArray(p.palette)?p.palette.filter(c=>/^#?[0-9a-fA-F]{3,6}$/.test(String(c))):[];
  pal=pal.map(c=>String(c)[0]==="#"?c:"#"+c);
  while(pal.length<5) pal.push(["#F2E9E4","#E6D6CE","#CDB4AB","#A98A83","#FAF6F3"][pal.length]);
  return {
    archetype: ARCH.indexOf(p.archetype)>=0?p.archetype:"pearl",
    palette: pal.slice(0,5),
    gloss: clamp(+p.gloss||55,0,100),
    roughness: clamp(+p.roughness||30,0,100),
    depth: clamp(+p.depth||55,0,100),
    seed: p.seed||1
  };
}

function matPanel(x,y,w,h,pin,opt){
  opt=opt||{};
  const p=normP(pin), u=uid(), pal=p.palette, rx=opt.rx==null?2:opt.rx;
  const R=mulberry32(hash(pal.join("")+p.archetype+p.seed+(opt.salt||"")));
  const gl=p.gloss/100, rg=p.roughness/100, dp=p.depth/100, A=p.archetype;
  let d=`<defs>`;
  d+=`<clipPath id="c${u}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}"/></clipPath>`;
  d+=`<linearGradient id="bg${u}" x1="0.1" y1="0" x2="0.75" y2="1">
        <stop offset="0" stop-color="${lighten(pal[4],.12)}"/>
        <stop offset=".45" stop-color="${pal[1]}"/>
        <stop offset="1" stop-color="${darken(pal[3],.14+dp*.18)}"/></linearGradient>`;
  d+=`<radialGradient id="vg${u}" cx=".46" cy=".38" r=".8">
        <stop offset=".38" stop-color="#000" stop-opacity="0"/>
        <stop offset="1" stop-color="${darken(pal[3],.5)}" stop-opacity="${(.14+dp*.24).toFixed(2)}"/></radialGradient>`;
  d+=`<filter id="gr${u}" x="-4%" y="-4%" width="108%" height="108%">
        <feTurbulence type="fractalNoise" baseFrequency="${(0.6+rg*1.1).toFixed(2)}" numOctaves="3" seed="${Math.floor(R()*90)}"/>
        <feColorMatrix type="saturate" values="0"/></filter>`;
  d+=`<filter id="bl${u}" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="${(Math.min(w,h)*0.05).toFixed(1)}"/></filter>`;
  d+=`<filter id="bs${u}" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="${(Math.min(w,h)*0.018).toFixed(1)}"/></filter>`;

  let b=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#bg${u})"/>`;

  if(A==="silk"){
    /* 세로 새틴 시닝 + 가로 주름 */
    let stops="",off=0,i=0;
    while(off<1){
      const c=(i%2===0)?lighten(pal[i%5],.06+R()*.13):darken(pal[(i+2)%5],.03+R()*.10);
      stops+=`<stop offset="${off.toFixed(3)}" stop-color="${c}"/>`;
      off+=0.016+R()*0.036; i++;
    }
    stops+=`<stop offset="1" stop-color="${pal[1]}"/>`;
    d+=`<linearGradient id="sk${u}" x1="0" y1="0" x2="1" y2="0.18">${stops}</linearGradient>`;
    b+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#sk${u})"/>`;

      b+=`<path d="${path}" fill="none" stroke="${lighten(pal[4],.6)}" stroke-width="${(h*0.028).toFixed(1)}" opacity="${(.10+gl*.24).toFixed(2)}" filter="url(#bl${u})"/>`;

  } else if(A==="petal"){

    b+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#pb${u})"/>`;
    const cxs=x+w*0.46, cys=y+h*0.52;
    for(let i=0;i<10;i++){
      const layer=i<4?0:1;
      const ang=(i/(layer?6:4))*360+R()*70+layer*24, rad=(ang*Math.PI)/180;
      const off=layer?0.28:0.10;
      const px=cxs+Math.cos(rad)*w*off*(0.6+R()*0.9), py=cys+Math.sin(rad)*h*off*(0.6+R()*0.9);
      const sc=layer?(0.5+R()*0.34):(0.66+R()*0.4);

            <stop offset=".55" stop-color="${lighten(c,.14)}"/>
            <stop offset="1" stop-color="${darken(c,.14)}"/></radialGradient>`;
      const pth=`M${px},${py} C ${px+rr*.35},${py-rr2} ${px+rr*.95},${py-rr2*.7} ${px+rr},${py}
                 C ${px+rr*.95},${py+rr2*.75} ${px+rr*.35},${py+rr2} ${px},${py} Z`;
      const tr=`rotate(${ang.toFixed(1)} ${px.toFixed(1)} ${py.toFixed(1)})`;
      b+=`<path d="${pth}" transform="${tr}" fill="${darken(pal[3],.3)}" opacity=".3" filter="url(#bs${u})"/>`;
      b+=`<path d="${pth}" transform="${tr}" fill="url(#pt${u}${i})" opacity="${(0.82+R()*0.16).toFixed(2)}"/>`;
      b+=`<path d="${pth}" transform="${tr}" fill="none" stroke="${lighten(pal[4],.55)}" stroke-width="1" opacity="${layer?0.22:0.42}"/>`;

    b+=`<ellipse cx="${cxs}" cy="${cys}" rx="${w*0.13}" ry="${h*0.10}" fill="${lighten(pal[4],.6)}" opacity=".6" filter="url(#bs${u})"/>`;
  } else if(A==="metal"){
    d+=`<linearGradient id="mv${u}" x1="0" y1="0" x2="0.12" y2="1">

          <stop offset=".34" stop-color="${lighten(pal[4],.26)}"/>
          <stop offset=".52" stop-color="${pal[1]}"/>
          <stop offset=".72" stop-color="${darken(pal[2],.13)}"/>
          <stop offset=".88" stop-color="${lighten(pal[0],.12)}"/>
          <stop offset="1" stop-color="${darken(pal[3],.11)}"/></linearGradient>
        <linearGradient id="sw${u}" x1="0" y1="0" x2="1" y2=".55">
          <stop offset="0" stop-color="#fff" stop-opacity="0"/>
          <stop offset=".40" stop-color="#fff" stop-opacity="${(0.06+gl*0.30).toFixed(2)}"/>
          <stop offset=".58" stop-color="#fff" stop-opacity="0"/></linearGradient>`;
    b+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#mv${u})"/>`;
    const n=Math.max(28,Math.min(200,Math.round(h/1.15)));
    let hl="";
    for(let i=0;i<n;i++){
      const yy=y+(i+0.4)*h/n, th=(h/n)*(0.3+R()*0.42), o=(0.04+R()*0.16)*(0.4+rg*0.7);
      hl+=`<rect x="${x}" y="${yy.toFixed(2)}" width="${w}" height="${th.toFixed(2)}" fill="${R()>0.48?"#FFFFFF":"#3A322C"}" opacity="${o.toFixed(3)}"/>`;
    }
    b+=hl;
    b+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#sw${u})"/>`;
  } else if(A==="glass"){
    d+=`<linearGradient id="gs${u}" x1=".05" y1="0" x2=".85" y2="1">
          <stop offset="0" stop-color="${lighten(pal[4],.42)}" stop-opacity=".92"/>
          <stop offset=".42" stop-color="${pal[1]}" stop-opacity=".72"/>
          <stop offset="1" stop-color="${darken(pal[3],.14)}" stop-opacity=".88"/></linearGradient>`;
    b+=`<ellipse cx="${x+w*0.66}" cy="${y+h*0.72}" rx="${w*0.55}" ry="${h*0.32}" fill="${darken(pal[3],.18)}" opacity=".6" filter="url(#bl${u})"/>`;
    b+=`<ellipse cx="${x+w*0.28}" cy="${y+h*0.24}" rx="${w*0.44}" ry="${h*0.24}" fill="${lighten(pal[4],.5)}" opacity=".78" filter="url(#bl${u})"/>`;
    const px=x+w*0.09, py=y+h*0.09, pw=w*0.82, ph=h*0.82, pr=Math.min(pw,ph)*0.07;
    b+=`<rect x="${px}" y="${py}" width="${pw}" height="${ph}" rx="${pr}" fill="url(#gs${u})"/>`;
    b+=`<rect x="${px}" y="${py}" width="${pw}" height="${ph}" rx="${pr}" filter="url(#gr${u})" opacity="${(0.05+rg*0.1).toFixed(3)}"/>`;
    b+=`<path d="M${px+pr},${py+0.8} L ${px+pw-pr},${py+0.8}" stroke="#fff" stroke-width="1.6" opacity="${(0.4+gl*0.5).toFixed(2)}"/>`;
    b+=`<path d="M${px+pr},${py+ph-0.8} L ${px+pw-pr},${py+ph-0.8}" stroke="${darken(pal[3],.35)}" stroke-width="1.2" opacity=".5"/>`;
    b+=`<path d="M${px+pw*0.12},${py+ph*0.92} L ${px+pw*0.56},${py+ph*0.08}" stroke="#fff" stroke-width="${(Math.min(w,h)*0.05).toFixed(1)}" opacity="${(0.14+gl*0.34).toFixed(2)}" filter="url(#bs${u})" fill="none"/>`;
    b+=`<rect x="${px}" y="${py}" width="${pw}" height="${ph}" rx="${pr}" fill="none" stroke="${lighten(pal[4],.6)}" stroke-width="1" opacity=".55"/>`;
  } else if(A==="stone"){
    d+=`<filter id="mt${u}" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="${(0.012+rg*0.026).toFixed(3)}" numOctaves="4" seed="${Math.floor(R()*90)}"/>

    b+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" filter="url(#mt${u})" opacity="${(0.22+rg*0.26).toFixed(2)}"/>`;
    b+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${withA(pal[1],0.42)}"/>`;

      b+=`<circle cx="${(x+w*R()).toFixed(1)}" cy="${(y+h*R()).toFixed(1)}" r="${(Math.min(w,h)*(0.006+R()*0.016)).toFixed(2)}"
           fill="${R()>0.5?lighten(pal[4],.4):darken(pal[3],.3)}" opacity="${(0.18+R()*0.4).toFixed(2)}"/>`;
    }
    b+=`<ellipse cx="${x+w*0.34}" cy="${y+h*0.26}" rx="${w*0.5}" ry="${h*0.3}" fill="${lighten(pal[4],.35)}" opacity=".22" filter="url(#bl${u})"/>`;
  } else if(A==="liquid"){
    d+=`<radialGradient id="lq${u}" cx=".34" cy=".28" r=".85">
          <stop offset="0" stop-color="${lighten(pal[4],.45)}"/>
          <stop offset=".45" stop-color="${pal[1]}"/>
          <stop offset="1" stop-color="${darken(pal[3],.26)}"/></radialGradient>`;
    b+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#lq${u})"/>`;
    for(let i=0;i<5;i++){
      const yy=y+h*(0.14+i*0.18)+R()*h*0.04;
      b+=`<path d="M${x-6},${yy} Q ${x+w*0.48},${yy-h*(0.05+R()*0.11)} ${x+w+6},${yy+h*0.04}"
           fill="none" stroke="${lighten(pal[4],.6)}" stroke-width="${(2+gl*5).toFixed(1)}" opacity="${(0.10+gl*0.34).toFixed(2)}" filter="url(#bs${u})"/>`;
    }
    b+=`<ellipse cx="${x+w*0.3}" cy="${y+h*0.22}" rx="${w*0.15}" ry="${h*0.06}" fill="#fff" opacity="${(0.3+gl*0.5).toFixed(2)}" filter="url(#bs${u})"/>`;
  } else if(A==="fabric"){
    const step=Math.max(2.4,Math.min(w,h)/34);

      we+=`<rect x="${x}" y="${yy.toFixed(1)}" width="${w}" height="${(step*0.45).toFixed(2)}" fill="${darken(pal[3],.2)}" opacity="${(0.07+rg*0.12).toFixed(3)}"/>`;

      we+=`<rect x="${xx.toFixed(1)}" y="${y}" width="${(step*0.45).toFixed(2)}" height="${h}" fill="${lighten(pal[4],.4)}" opacity="${(0.06+rg*0.10).toFixed(3)}"/>`;
    b+=we;
    b+=`<ellipse cx="${x+w*0.36}" cy="${y+h*0.3}" rx="${w*0.55}" ry="${h*0.36}" fill="${lighten(pal[4],.4)}" opacity=".2" filter="url(#bl${u})"/>`;
  } else { /* pearl */
    for(let i=0;i<5;i++){
      const c=shift(pal[i%5],(i-2)*5,2,5);

           rx="${(w*(0.34+R()*0.34)).toFixed(1)}" ry="${(h*(0.2+R()*0.26)).toFixed(1)}"
           fill="${c}" opacity="${(0.34+R()*0.3).toFixed(2)}" filter="url(#bl${u})"/>`;

      const yy=y+h*(0.24+i*0.26);
      b+=`<path d="M${x-6},${yy} Q ${x+w*0.5},${yy-h*0.14} ${x+w+6},${yy+h*0.05}" fill="none"

           opacity="${(0.10+gl*0.26).toFixed(2)}" filter="url(#bl${u})"/>`;

}

/* 제품 칩 — 모서리 베벨과 하이라이트가 있는 CMF 샘플 */
function chip(x,y,w,h,p){
  const u=uid(), pp=normP(p), r=Math.min(w,h)*0.16;
  let s=`<defs><linearGradient id="ch${u}" x1="0" y1="0" x2=".45" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="${(0.18+pp.gloss/100*0.34).toFixed(2)}"/>
      <stop offset=".38" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="${darken(pp.palette[3],.35)}" stop-opacity=".18"/></linearGradient>
      <filter id="sh${u}" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="${(h*0.03).toFixed(1)}" stdDeviation="${(h*0.035).toFixed(1)}"
        flood-color="${darken(pp.palette[3],.45)}" flood-opacity="0.18"/></filter></defs>`;
  s+=`<g filter="url(#sh${u})">`;
  s+=matPanel(x,y,w,h,pp,{rx:r,edge:false,salt:"chip"});
  s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="url(#ch${u})"/>`;
  s+=`<path d="M${x+r},${y+1} L ${x+w-r},${y+1}" stroke="#fff" stroke-width="1.4"
       opacity="${(0.34+pp.gloss/100*0.5).toFixed(2)}" fill="none"/>`;
  s+=`<rect x="${x+.5}" y="${y+.5}" width="${w-1}" height="${h-1}" rx="${r}" fill="none"
       stroke="${withA(darken(pp.palette[3],.3),0.34)}" stroke-width="1"/></g>`;
  return s;
}

/* ---- 단계별 "한 장의 이미지" 합성 ---- */
function triptych(items,label){
  const W=660,H=548,pad=12,gap=12,pw=(W-pad*2-gap*2)/3,ph=418,py=52;
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`;
  s+=`<rect width="${W}" height="${H}" fill="#FFFFFF"/>`;
  s+=svgText(pad,26,[label||"REFERENCE IMAGE"],{fs:11,fill:"#9C8F88",ls:"3.2"});
  s+=`<line x1="${pad}" y1="38" x2="${W-pad}" y2="38" stroke="#E4DBD5" stroke-width="1"/>`;
  items.slice(0,3).forEach((it,i)=>{
    const x=pad+i*(pw+gap);
    s+=matPanel(x,py,pw,ph,it,{salt:"tri"+i});
    s+=`<rect x="${x+9}" y="${py+9}" width="26" height="17" fill="rgba(255,255,255,.82)"/>`;
    s+=svgText(x+13,py+21,["0"+(i+1)],{fs:10,fill:"#8A6660",ls:"1.6",weight:600});
    const t=wrap(it.title||("해석 "+(i+1)),pw-4,13,2);
    s+=svgText(x,py+ph+22,t,{fs:13,fill:"#2B2522",serif:true,lh:17});
    s+=svgText(x,py+ph+22+(t.length>1?34:17),[String(it.en||"").toUpperCase().slice(0,26)],{fs:8,fill:"#9C8F88",ls:"1.6"});
  });
  return s+`</svg>`;
}

function sampleSheet(list){
  const W=480,cols=2,cw=228,gap=16,x0=6,rh=190,y0=44;
  const rows=Math.ceil(Math.min(list.length,8)/cols), H=y0+rows*rh+8;
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`;
  s+=`<rect width="${W}" height="${H}" fill="#FFFFFF"/>`;
  s+=svgText(x0,24,["CMF SAMPLES"],{fs:10,fill:"#9C8F88",ls:"3"});
  s+=`<line x1="${x0}" y1="34" x2="${W-x0}" y2="34" stroke="#E4DBD5"/>`;
  list.slice(0,8).forEach((it,i)=>{
    const c=i%cols, r=(i/cols)|0, x=x0+c*(cw+gap), y=y0+r*rh;
    s+=svgText(x,y+11,[(i<9?"0":"")+(i+1)],{fs:9,fill:"#A9857E",ls:"1.6",weight:600});
    s+=svgText(x+24,y+11,wrap(it.kr||"",cw-26,11,1),{fs:11,fill:"#2B2522"});
    s+=svgText(x,y+25,[String(it.en||"").slice(0,32)],{fs:8.5,fill:"#9C8F88",ls:"0.6"});
    s+=chip(x,y+34,cw,110,it);
    s+=svgText(x,y+158,wrap(it.spec||"",cw,8.5,2),{fs:8.5,fill:"#6E625C",lh:12});
  });
  return s+`</svg>`;
}

/* ==========================================================================
   3. AI 레이어 (Claude API + 오프라인 폴백)
   ========================================================================== */
async function ask(prompt,fallbackFn){
  const key="k"+hash(prompt);
  if(S.cache[key]) return S.cache[key];
  const body={model:"claude-sonnet-4-6",max_tokens:1000,
    messages:[{role:"user",content:prompt+"\n\n반드시 JSON 객체 하나만 출력하세요. 코드펜스, 설명, 접두문 없이 { 로 시작해 } 로 끝나야 합니다."}]};
  const headers={"Content-Type":"application/json"};
  if(S.apiKey){headers["x-api-key"]=S.apiKey;headers["anthropic-version"]="2023-06-01";headers["anthropic-dangerous-direct-browser-access"]="true";}
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers,body:JSON.stringify(body)});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const data=await res.json();
    let txt=(data.content||[]).map(c=>c.type==="text"?c.text:"").join("\n");
    txt=txt.replace(/```json/gi,"").replace(/```/g,"").trim();
    const a=txt.indexOf("{"), b=txt.lastIndexOf("}");
    const parsed=JSON.parse(txt.slice(a,b+1));
    S.cache[key]=parsed; S.offline=false;
    return parsed;
  }catch(e){
    S.offline=true;
    const fb=fallbackFn();
    S.cache[key]=fb;
    return fb;
  }
}

  const r=await ask(p,()=>({results:[0,1,2].map(i=>{
    const base=toneOf(kw,i);

이 감성이 사용자에게 '어떻게 지각되는가'를 서술한 지각 특성 10개를 제안하세요. 시각·촉각·빛·색·구조를 고루 포함합니다.
형식: {"results":[{"title":"8~14자 한국어","desc":"40~60자, 왜 그렇게 지각되는지"}]}`;
  const r=await ask(p,()=>({results:PERC_BANK.map(([title,desc])=>({title,desc}))}));
  S.percs=(r.results||[]).slice(0,10);
}

async function loadProps(){
  const c=CTX();
  const p=`CMF 디자인 방법론 3단계 '물성(Material Properties)'.
감성: "${c.kw}" / 해석: "${c.interp?c.interp.title:""}"
선택된 지각 특성: ${c.perc.join(" · ")}
이 지각을 물리적으로 구현하기 위해 조절해야 할 물성 항목 20개를 제안하세요. value는 이 감성에 맞는 목표값(0~100).
형식: {"results":[{"kr":"광택","en":"Gloss","low":"LOW","high":"HIGH","value":62,"note":"25자 내외 근거"}]}`;
  const r=await ask(p,()=>({results:PROP_BANK.map(([kr,en,low,high],i)=>{
    const t=toneOf(S.keyword,0), base=[t.gloss,t.roughness,72,38,t.depth,34,66,20,42,78,55,30,74,58,46,50,36,68,32,60];
    return {kr,en,low,high,value:base[i]||50,note:"선택한 지각 특성과의 정합을 위한 목표값."};
  })}));
  S.props=(r.results||[]).slice(0,20).map(o=>({kr:o.kr,en:o.en,low:o.low||"LOW",high:o.high||"HIGH",value:clamp(+o.value||50,0,100),note:o.note||""}));
}

async function loadSents(){

감성: "${c.kw}" / 해석: "${c.interp?c.interp.title:""}"
지각: ${c.perc.join(" · ")}
물성 목표값: ${c.prop.join(", ")}
위를 하나의 이미지로 응축한 시적이면서 구체적인 영감의 문장 3개를 만드세요. 각 60~95자, 재료·빛·시간의 언어를 사용하고 서로 다른 인상이어야 합니다.

async function loadMats(){

감성: "${c.kw}" / 영감의 문장: "${c.sent}"
물성 목표값: ${c.prop.join(", ")}
양산 가능한 소재 10종과 각각의 구체적 가공기법을 제안하세요. 가공기법은 실제 공정 용어(Anodizing, PVD, AG Coating, In-mold Texture, Bead Blasting 등)를 사용합니다.
${PAL_HINT}
형식: {"results":[{"name":"Aluminum","kr":"알루미늄","processes":["Anodizing + Hairline","Champagne Anodizing"],"effect":"20자 내외 효과","archetype":"...","palette":["#..","#..","#..","#..","#.."],"gloss":0,"roughness":0,"depth":0}]}`;

감성: "${c.kw}" / 영감의 문장: "${c.sent}"
선택된 소재·가공: ${c.mat.join(" | ")}
실제 샘플 칩으로 제작 가능한 CMF 샘플 8개를 제안하세요. 선택된 소재를 고루 반영하고, 컬러 네이밍은 구체적이어야 합니다.
subtitle은 이 보드 전체를 요약하는 30자 내외 한 문장입니다.

/* ==========================================================================
   5. 최종 보드 (첨부 레이아웃 재현)
   ========================================================================== */
function buildBoard(){
  const W=1536,H=1024,INK="#2B2522",MUT="#6E625C",FAINT="#9C8F88",LINE="#E4DBD5",ACC="#A9857E";
  const cols=[{x:16,w:200},{x:230,w:215},{x:457,w:270},{x:739,w:215},{x:966,w:270},{x:1248,w:272}];
  const CT=165, CB=925, CH=CB-CT;
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`;
  s+=`<rect width="${W}" height="${H}" fill="#FAF8F6"/>`;

  /* header */
  s+=svgText(20,50,["감성 사례"],{fs:30,fill:INK,serif:true});
  s+=`<line x1="152" y1="24" x2="152" y2="56" stroke="#C6B9B2" stroke-width="1"/>`;
  s+=svgText(166,50,[wrap(S.keyword,560,28,1)[0]],{fs:28,fill:INK,serif:true});
  s+=svgText(W-20,46,wrap(S.subtitle||"",620,15,1),{fs:15,fill:MUT,anchor:"end"});
  s+=`<line x1="0" y1="76" x2="${W}" y2="76" stroke="${LINE}"/>`;

  /* column heads */
  const heads=[["① 감성","Emotion"],["② 지각","Perception"],["③ 물성","Material Properties"],
               ["④ 영감의 문장","Inspiration"],["⑤ 구현 가능한 소재와 가공기법","Material & Process"],["⑥ CMF 샘플 제안","CMF Samples"]];
  heads.forEach((hd,i)=>{
    const c=cols[i], cx=c.x+c.w/2;
    s+=svgText(cx,124,[hd[0]+" "+(i<3?hd[1]:"")],{fs:15,fill:INK,anchor:"middle"});
    if(i>=3) s+=svgText(cx,144,[hd[1]],{fs:12,fill:MUT,anchor:"middle"});
    if(i<5){
      const ax=cols[i+1].x-((cols[i+1].x-(c.x+c.w))/2);
      s+=`<path d="M${ax-13},119 L ${ax+13},119 M ${ax+7},114 L ${ax+13},119 L ${ax+7},124" stroke="${INK}" stroke-width="1.3" fill="none"/>`;
    }
  });

  const it=S.interps[S.iSel]||S.interps[0]||normP({});
  const sent=S.sents[S.sSel]||S.sents[0]||normP({});

  /* ① emotion */
  {
    const c=cols[0];
    s+=matPanel(c.x,CT,c.w,178,it,{salt:"b1a"});
    let y=CT+178+30;
    (it.paragraphs||[]).slice(0,3).forEach(par=>{
      const L=wrap(par,c.w,12.5); s+=svgText(c.x,y,L,{fs:12.5,fill:MUT,lh:20}); y+=L.length*20+18;
    });
    const rest=CB-y-4;
    if(rest>60) s+=matPanel(c.x,y,c.w,rest,Object.assign({},it,{seed:7,archetype:it.archetype==="petal"?"silk":"petal"}),{salt:"b1b"});
  }

  /* ② perception */
  {
    const c=cols[1];
    s+=`<rect x="${c.x}" y="${CT}" width="${c.w}" height="${CH}" fill="#FFFFFF" stroke="${LINE}"/>`;
    const picks=S.pSel.slice(0,5).map(i=>S.percs[i]).filter(Boolean);
    let y=CT+34;
    picks.forEach((p,i)=>{
      s+=svgText(c.x+14,y,[String(i+1)],{fs:15,fill:ACC,serif:true});
      s+=svgText(c.x+36,y,wrap(p.title,c.w-50,14,2),{fs:14,fill:INK,lh:19});
      const L=wrap(p.desc,c.w-50,11.5);
      s+=svgText(c.x+36,y+24,L,{fs:11.5,fill:MUT,lh:17});
      y+=Math.max(78,24+L.length*17+24);
    });
  }

  /* ③ properties */
  {
    const c=cols[2];
    s+=`<rect x="${c.x}" y="${CT}" width="${c.w}" height="${CH}" fill="#FFFFFF" stroke="${LINE}"/>`;
    const picks=S.prSel.slice(0,10).map(i=>S.props[i]).filter(Boolean);
    const bx=c.x+20, bw=c.w-40, step=Math.min(74,(CH-46)/Math.max(picks.length,1));
    let y=CT+34;
    picks.forEach(p=>{
      s+=svgText(bx,y,[p.kr],{fs:13,fill:INK});
      s+=svgText(bx+(p.kr.length*13)+10,y,[p.en],{fs:10.5,fill:FAINT});
      const ly=y+24;
      s+=svgText(bx,ly+3,[p.low],{fs:8.5,fill:MUT,ls:"0.8"});
      s+=svgText(bx+bw,ly+3,[p.high],{fs:8.5,fill:MUT,ls:"0.8",anchor:"end"});
      const t1=bx+30, t2=bx+bw-32;
      s+=`<line x1="${t1}" y1="${ly}" x2="${t2}" y2="${ly}" stroke="${LINE}" stroke-width="1.4"/>`;
      s+=`<circle cx="${(t1+(t2-t1)*p.value/100).toFixed(1)}" cy="${ly}" r="5.2" fill="${ACC}"/>`;
      y+=step;
    });
  }

  /* ④ inspiration */
  {
    const c=cols[3];
    s+=`<rect x="${c.x}" y="${CT}" width="${c.w}" height="${CH}" fill="#FFFFFF" stroke="${LINE}"/>`;
    const L=wrap(sent.text||"",c.w-44,15);
    const th=L.length*28;
    s+=svgText(c.x+c.w/2,CT+70,L,{fs:15,fill:"#8A6660",serif:true,anchor:"middle",lh:28});
    const iy=CT+70+th+34, ih=CB-iy-14;
    if(ih>60) s+=matPanel(c.x+14,iy,c.w-28,ih,sent,{salt:"b4"});
  }

  /* ⑤ material & process */
  {
    const c=cols[4];
    s+=`<rect x="${c.x}" y="${CT}" width="${c.w}" height="${CH}" fill="#FFFFFF" stroke="${LINE}"/>`;
    const picks=S.mSel.slice(0,5).map(i=>S.mats[i]).filter(Boolean);
    const ih=Math.min(148,(CH-8)/Math.max(picks.length,1));
    picks.forEach((m,i)=>{
      const y=CT+4+i*ih;
      s+=matPanel(c.x+4,y+4,92,ih-12,m,{salt:"b5"+i});
      const tx=c.x+110;
      s+=svgText(tx,y+26,[m.name],{fs:15,fill:INK,weight:600});
      let yy=y+46;
      (m.processes||[]).slice(0,2).forEach(pr=>{
        s+=svgText(tx,yy,["→ "+pr],{fs:11.5,fill:MUT}); yy+=19;
      });
      const L=wrap("→ "+(m.effect||""),c.w-118,11.5,2);
      s+=svgText(tx,yy,L,{fs:11.5,fill:MUT,lh:17});
      if(i<picks.length-1) s+=`<line x1="${c.x+108}" y1="${y+ih-6}" x2="${c.x+c.w-8}" y2="${y+ih-6}" stroke="${LINE}"/>`;
    });
  }

  /* ⑥ samples */
  {
    const c=cols[5], cw=(c.w-10)/2, rh=(CH-6)/4;
    S.samples.slice(0,8).forEach((sm,i)=>{
      const col=i%2, row=(i/2)|0, x=c.x+col*(cw+10), y=CT+row*rh;
      s+=`<rect x="${x}" y="${y}" width="${cw}" height="${rh-8}" fill="#FFFFFF" stroke="${LINE}"/>`;
      s+=`<rect x="${x+8}" y="${y+9}" width="20" height="15" fill="none" stroke="${ACC}" stroke-width=".8"/>`;
      s+=svgText(x+12,y+21,[(i<9?"0":"")+(i+1)],{fs:9,fill:ACC,weight:600});
      s+=svgText(x+34,y+21,wrap(sm.kr,cw-40,11,1),{fs:11,fill:INK});
      s+=svgText(x+34,y+34,[String(sm.en||"").slice(0,26)],{fs:8.5,fill:FAINT});
      s+=chip(x+8,y+42,cw-16,rh-102,sm);
      s+=svgText(x+8,y+rh-46,wrap(sm.spec||"",cw-16,8.5,2),{fs:8.5,fill:MUT,lh:12});
    });
  }

  /* footer methodology */
  {
    const fy=948,fh=62;
    s+=`<rect x="16" y="${fy}" width="${W-32}" height="${fh}" fill="#FFFFFF" stroke="${LINE}"/>`;
    s+=`<rect x="16" y="${fy}" width="200" height="${fh}" fill="#F1E3DE"/>`;
    s+=svgText(48,fy+28,["CMF 디자인 방법론"],{fs:14,fill:INK});
    s+=svgText(48,fy+46,["CMF Design Methodology"],{fs:9.5,fill:MUT,ls:"0.6"});
    const stages=[["감성에서 출발","(Emotion)"],["어떻게 지각되는가","(Perception)"],["어떤 물성이 필요한가","(Materiality)"],
                  ["어떻게 구현할 것인가","(Implementation)"],["샘플로 검증","(Validation)"]];
    const x0=250, span=(W-32-250)/5;
    stages.forEach((st,i)=>{
      const cx=x0+span*i+span/2-40;
      s+=svgText(cx,fy+28,[st[0]],{fs:13,fill:INK,anchor:"middle"});
      s+=svgText(cx,fy+46,[st[1]],{fs:10.5,fill:MUT,anchor:"middle"});
      if(i<4){const ax=cx+span/2+10;
        s+=`<path d="M${ax-11},${fy+34} L ${ax+11},${fy+34} M ${ax+6},${fy+29} L ${ax+11},${fy+34} L ${ax+6},${fy+39}" stroke="${INK}" stroke-width="1.2" fill="none"/>`;}
    });
  }
  return s+`</svg>`;
}

/* ==========================================================================
   6. 화면 렌더
   ========================================================================== */
function head(i){
  const st=STEPS[i-1];
  return `<div class="eyebrow">${st.eyebrow}</div><h2 class="title">${esc(st.title)}</h2>`;
}
function loading(msg){
  stage.innerHTML=`<div class="screen"><div class="load"><span class="dot"></span><span class="dot"></span><span class="dot"></span><p>${esc(msg)}</p></div></div>`;
}
function offlineNotice(){
  if(!S.offline) return "";
  return `<div class="notice">내장 레퍼런스 라이브러리로 생성 중입니다. API 키를 연결하면 키워드에 맞춰 문장과 컬러를 새로 씁니다.
    <div class="keyrow"><input id="apik" type="password" placeholder="sk-ant-..." value="${esc(S.apiKey)}"><button id="savek">연결</button></div></div>`;
}
function bindKey(){
  const b=$("#savek"); if(!b) return;
  b.onclick=()=>{const v=$("#apik").value.trim(); S.apiKey=v; localStorage.setItem("cmf_key",v); S.cache={}; render();};
}
function markSVG(){return "✓";}

function render(){
  $("#stepno").textContent=(S.step<10?"0":"")+S.step+" / 08";
  $("#rail").innerHTML=STEPS.map(s=>`<i class="${s.n===S.step?"on":(s.n<S.step?"done":"")}"></i>`).join("");
  $("#back").style.visibility=S.step===1?"hidden":"visible";
  stage.scrollTop=0;
  ({1:r1,2:r2,3:r3,4:r4,5:r5,6:r6,7:r7,8:r8}[S.step])();
}

/* --- 1 --- */
function r1(){
  stage.innerHTML=`<div class="screen">${head(1)}
    <p class="lede">CMF 디자인은 감성에서 출발합니다. 제품이 사용자에게 남겼으면 하는 인상을 형용사 문장으로 적어 주세요.</p>
    <div class="field"><textarea id="kw" placeholder="예) 차분하고 고급스럽고 여성스럽다">${esc(S.keyword)}</textarea></div>
    <div class="caplbl">감성 키워드 사례</div>
    <div class="chips">${EXAMPLES.map(e=>`<button class="chip" data-v="${esc(e)}">${esc(e)}</button>`).join("")}</div>
    <div class="rule"></div>
    <p class="lede" style="margin:0">감성 → 지각 → 물성 → 영감의 문장 → 소재·가공 → 샘플 → 컨셉 보드까지 8단계로 진행합니다.</p>
    ${offlineNotice()}</div>`;
  bindKey();
  const ta=$("#kw");
  ta.addEventListener("input",()=>{S.keyword=ta.value;gate();});
  stage.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ta.value=c.dataset.v;S.keyword=c.dataset.v;gate();ta.focus();});
  cta("감성 해석하기",()=>go(2,async()=>{loading("감성을 세 방향으로 해석하는 중");S.iSel=null;await loadInterps();}));
  gate();
}

/* --- 2 --- */
function r2(){
  stage.innerHTML=`<div class="screen">${head(2)}
    <p class="lede">“${esc(S.keyword)}”을(를) 세 방향으로 해석했습니다. 한 장의 레퍼런스 이미지 안에 세 해석이 함께 담겨 있습니다. 하나를 선택하세요.</p>

      <div class="opt ${S.iSel===i?"on":""}" data-i="${i}">
        <div class="mark">${markSVG()}</div><div class="num">0${i+1}</div>
        <h4>${esc(o.title)}</h4><div class="en">${esc(o.en||"")}</div>

  gate();
}

/* --- 3 --- */
function r3(){
  stage.innerHTML=`<div class="screen">${head(3)}
    <p class="lede">선택한 감성이 <b>어떻게 지각되는가</b>를 10가지로 정리했습니다. 5개 이상 선택하세요.</p>
    <div class="opts">${S.percs.map((o,i)=>`
      <div class="opt ${S.pSel.includes(i)?"on":""}" data-i="${i}">
        <div class="mark">${markSVG()}</div><div class="num">${(i<9?"0":"")+(i+1)}</div>
        <h4>${esc(o.title)}</h4><p>${esc(o.desc)}</p></div>`).join("")}</div></div>`;
  stage.querySelectorAll(".opt").forEach(el=>el.onclick=()=>{toggle(S.pSel,+el.dataset.i);r3();});
  cta("물성 제안 받기",()=>go(4,async()=>{loading("물성 항목을 산출하는 중");S.prSel=[];await loadProps();}));

/* ==========================================================================
   7. 내비게이션 / PNG
   ========================================================================== */
function toggle(arr,i){const k=arr.indexOf(i);if(k<0)arr.push(i);else arr.splice(k,1);}
let nextFn=null;
function cta(label,fn){$("#next").textContent=label;nextFn=fn;}
function gate(){
  const g=[
    ()=>[S.keyword.trim().length>=2,"감성 키워드를 입력하세요"],
    ()=>[S.iSel!=null,"해석 1개를 선택하세요"],
    ()=>[S.pSel.length>=5,`지각 특성 <b>${S.pSel.length}</b> / 최소 5개`],
    ()=>[S.prSel.length>=10,`물성 <b>${S.prSel.length}</b> / 최소 10개`],
    ()=>[S.sSel!=null,"영감의 문장 1개를 선택하세요"],
    ()=>[S.mSel.length>=5,`소재 <b>${S.mSel.length}</b> / 최소 5개`],
    ()=>[true,"8개 샘플이 확정되었습니다"],
    ()=>[true,"보드가 완성되었습니다"]
  ][S.step-1]();
  $("#next").disabled=!g[0];
  $("#count").innerHTML=g[0]&&S.step<3?"":g[1];
}
async function go(n,prep){
  $("#next").disabled=true;
  const prev=S.step; S.step=n;
  $("#stepno").textContent=(n<10?"0":"")+n+" / 08";
  $("#rail").innerHTML=STEPS.map(s=>`<i class="${s.n===n?"on":(s.n<n?"done":"")}"></i>`).join("");
  try{ if(prep) await prep(); }catch(e){ S.step=prev; }
  render();
}
$("#next").onclick=()=>{if(nextFn)nextFn();};
$("#back").onclick=()=>{if(S.step>1){S.step--;render();}};

function exportPNG(svg,name){
  const btn=$("#pngBtn"); if(btn)btn.textContent="저장 중…";
  const src=new XMLSerializer().serializeToString(svg);
  const blob=new Blob([src],{type:"image/svg+xml;charset=utf-8"});
  const url=URL.createObjectURL(blob), img=new Image();
  img.onload=()=>{
    const sc=2, cv=document.createElement("canvas");
    cv.width=1536*sc; cv.height=1024*sc;
    const ctx=cv.getContext("2d");
    ctx.fillStyle="#FAF8F6"; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.drawImage(img,0,0,cv.width,cv.height);
    URL.revokeObjectURL(url);
    cv.toBlob(b=>{
      const a=document.createElement("a");
      a.href=URL.createObjectURL(b); a.download=name; a.style.display="none";
      document.body.appendChild(a); a.click();
      setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},3000);
      if(btn)btn.textContent="PNG 저장";
    },"image/png");
  };
  img.onerror=()=>{URL.revokeObjectURL(url); if(btn)btn.textContent="PNG 저장 실패 — 다시 시도";};
  img.src=url;
}

render();
</script>
